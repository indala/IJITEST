name: 🚀 Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: production-deploy
  cancel-in-progress: false # Queue, don't cancel — never overlap deploys

env:
  DEPLOY_BASE: /home/u116573049/domains/ijitest.org/hbuilds
  NODE_VERSION: '24'

jobs:
  checks:
    name: 🧪 Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: pnpm test

      - name: 🔍 Run typecheck
        run: pnpm typecheck

      - name: 🧹 Run lint
        run: pnpm lint

  deploy:
    name: Build & Deploy
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup pnpm (auto-detected from pnpm-lock.yaml on server too)
      # -----------------------------------------------------------------------
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # -----------------------------------------------------------------------
      # 3. Install & Build
      # -----------------------------------------------------------------------
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Next.js
        run: |
          pnpm build
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Auth
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          # App URLs
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          # Email
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Database
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          # Payments
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          # Social
          NEXT_PUBLIC_FACEBOOK_URL: ${{ secrets.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_TWITTER_URL: ${{ secrets.NEXT_PUBLIC_TWITTER_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
          # Storage
          STORAGE_SERVICE_URL: ${{ secrets.STORAGE_SERVICE_URL }}
          STORAGE_SERVICE_SECRET: ${{ secrets.STORAGE_SERVICE_SECRET }}
          # PDF
          ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
          ILOVEPDF_SECRET_KEY: ${{ secrets.ILOVEPDF_SECRET_KEY }}
          # Cron & SEO
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # CrossRef DOI
          CROSSREF_USERNAME: ${{ secrets.CROSSREF_USERNAME }}
          CROSSREF_PASSWORD: ${{ secrets.CROSSREF_PASSWORD }}
          CROSSREF_PREFIX: ${{ secrets.CROSSREF_PREFIX }}
          CROSSREF_MEMBER_NAME: ${{ secrets.CROSSREF_MEMBER_NAME }}
          CROSSREF_DEPOSITOR_EMAIL: ${{ secrets.CROSSREF_DEPOSITOR_EMAIL }}
          CROSSREF_TEST_MODE: ${{ secrets.CROSSREF_TEST_MODE }}
          # Zenodo
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          ZENODO_API_URL: ${{ secrets.ZENODO_API_URL }}
          ZENODO_USE_SANDBOX: ${{ secrets.ZENODO_USE_SANDBOX }}

      # -----------------------------------------------------------------------
      # 4. Setup SSH
      # -----------------------------------------------------------------------
      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust the server fingerprint
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # -----------------------------------------------------------------------
      # 5. Atomic Isolated Version Deployment to Hostinger
      #    Generates a new version directory under hbuilds/versions/<ver-id>/
      #    to keep old JS chunks accessible during and after deployment.
      # -----------------------------------------------------------------------
      - name: 🚀 Deploy isolated version to server
        run: |
          VER_ID="ver-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          
          echo "Creating new isolated version directory: versions/$VER_ID"
          $SSH_CMD "mkdir -p ${{ env.DEPLOY_BASE }}/versions/$VER_ID/nodejs"

          rsync -az \
            --info=progress2 \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            .next/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_BASE }}/versions/$VER_ID/nodejs/.next/

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            .next/standalone/server.js \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_BASE }}/versions/$VER_ID/nodejs/server.js

          rsync -az \
            --info=progress2 \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_BASE }}/versions/$VER_ID/nodejs/public/

          $SSH_CMD "cd ${{ env.DEPLOY_BASE }}/versions/$VER_ID/nodejs && ln -sfn ../../../current/nodejs/node_modules ./node_modules && cp ../../../current/nodejs/.env ./.env 2>/dev/null || true"

          # Preserve previous version static chunk files so active browser sessions never 404
          $SSH_CMD "if [ -d ${{ env.DEPLOY_BASE }}/current/nodejs/.next/static ]; then cp -rn ${{ env.DEPLOY_BASE }}/current/nodejs/.next/static/* ${{ env.DEPLOY_BASE }}/versions/$VER_ID/nodejs/.next/static/ 2>/dev/null || true; fi"

      # -----------------------------------------------------------------------
      # 6. Atomic Symlink Swap & Passenger Restart
      # -----------------------------------------------------------------------
      - name: 🔀 Atomic symlink swap & restart Node.js
        run: |
          VER_ID="ver-${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          
          $SSH_CMD "set -e; cd ${{ env.DEPLOY_BASE }}; ln -sfn versions/$VER_ID current_tmp; mv -T current_tmp current; cd current/nodejs; mkdir -p tmp; touch tmp/restart.txt; touch server.js; echo '✅ Switched current symlink to versions/$VER_ID and restarted Passenger'"

      # -----------------------------------------------------------------------
      # 7. Cleanup old build versions (keep latest 3)
      # -----------------------------------------------------------------------
      - name: 🧹 Prune old version folders
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          $SSH_CMD "cd ${{ env.DEPLOY_BASE }}/versions && ls -dt ver-* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true"

      # -----------------------------------------------------------------------
      # 7. Health check — wait for app to come back up
      # -----------------------------------------------------------------------
      - name: 🏥 Health check
        run: |
          echo "Waiting 15s for app to restart..."
          sleep 15
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ secrets.NEXT_PUBLIC_APP_URL }}" || echo "000")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "307" ] || [ "$STATUS" = "302" ]; then
            echo "✅ App is up and responding."
          else
            echo "⚠️ App returned HTTP $STATUS — check Runtime Logs in hPanel."
            exit 1
          fi
