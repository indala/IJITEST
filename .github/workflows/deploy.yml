name: 🚀 Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from GitHub UI

concurrency:
  group: production-deploy
  cancel-in-progress: false # Queue, don't cancel — never overlap deploys

env:
  DEPLOY_BASE: /home/u116573049/domains/ijitest.org/hbuilds
  NODE_VERSION: '24'

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup pnpm (auto-detected from pnpm-lock.yaml on server too)
      # -----------------------------------------------------------------------
      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: 🟢 Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      # -----------------------------------------------------------------------
      # 3. Install & Build
      # -----------------------------------------------------------------------
      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build Next.js
        run: pnpm build
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          # Auth
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          # App URLs
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          # Email
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Database
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
          # Payments
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          # Social
          NEXT_PUBLIC_FACEBOOK_URL: ${{ secrets.NEXT_PUBLIC_FACEBOOK_URL }}
          NEXT_PUBLIC_TWITTER_URL: ${{ secrets.NEXT_PUBLIC_TWITTER_URL }}
          NEXT_PUBLIC_INSTAGRAM_URL: ${{ secrets.NEXT_PUBLIC_INSTAGRAM_URL }}
          # Storage
          STORAGE_SERVICE_URL: ${{ secrets.STORAGE_SERVICE_URL }}
          STORAGE_SERVICE_SECRET: ${{ secrets.STORAGE_SERVICE_SECRET }}
          # PDF
          ILOVEPDF_PUBLIC_KEY: ${{ secrets.ILOVEPDF_PUBLIC_KEY }}
          ILOVEPDF_SECRET_KEY: ${{ secrets.ILOVEPDF_SECRET_KEY }}
          # Cron & SEO
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # CrossRef DOI
          CROSSREF_USERNAME: ${{ secrets.CROSSREF_USERNAME }}
          CROSSREF_PASSWORD: ${{ secrets.CROSSREF_PASSWORD }}
          CROSSREF_PREFIX: ${{ secrets.CROSSREF_PREFIX }}
          CROSSREF_MEMBER_NAME: ${{ secrets.CROSSREF_MEMBER_NAME }}
          CROSSREF_DEPOSITOR_EMAIL: ${{ secrets.CROSSREF_DEPOSITOR_EMAIL }}
          CROSSREF_TEST_MODE: ${{ secrets.CROSSREF_TEST_MODE }}
          # Zenodo
          ZENODO_ACCESS_TOKEN: ${{ secrets.ZENODO_ACCESS_TOKEN }}
          ZENODO_API_URL: ${{ secrets.ZENODO_API_URL }}
          ZENODO_USE_SANDBOX: ${{ secrets.ZENODO_USE_SANDBOX }}

      # -----------------------------------------------------------------------
      # 4. Setup SSH
      # -----------------------------------------------------------------------
      - name: 🔑 Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Trust the server fingerprint
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      # -----------------------------------------------------------------------
      # 5. Sync build to server
      #    Uses the 'current' symlink — always targets the active version,
      #    even after Hostinger panel redeploys create a new UUID folder.
      # -----------------------------------------------------------------------
      - name: 🔁 Sync .next build to staging
        run: |
          rsync -az --delete \
            --info=progress2 \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            .next/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_BASE }}/current/nodejs/.next.new/

      - name: 🔁 Sync public folder
        run: |
          rsync -az \
            --info=progress2 \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_BASE }}/current/nodejs/public/

      # -----------------------------------------------------------------------
      # 6. Swap in the staged build, then restart the Node.js process.
      # -----------------------------------------------------------------------
      - name: 🔀 Swap build and restart Node.js app
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e; cd ${{ env.DEPLOY_BASE }}/current/nodejs; rm -rf .next.old; mv .next .next.old; if ! mv .next.new .next; then mv .next.old .next; exit 1; fi; pkill -u \$(whoami) -f '[n]ext-server' || true; touch server.js; echo '✅ Build swapped and restart signal sent'"

      # -----------------------------------------------------------------------
      # 7. Health check — verify the expected build and its page assets
      # -----------------------------------------------------------------------
      - name: 🏥 Health check (build ID + assets)
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
        run: |
          SITE_URL="${SITE_URL%/}"
          EXPECTED=$(cat .next/BUILD_ID)
          for i in $(seq 1 12); do
            sleep 10
            HTML=$(curl -fsSL --max-time 20 "$SITE_URL/?ci=$RANDOM" || true)
            LIVE=$(printf '%s' "$HTML" | python3 -c 'import re,sys; m=re.search(r"\\?\"b\\?\"\s*:\s*\\?\"([^\"\\]+)", sys.stdin.read()); print(m.group(1) if m else "")')
            echo "try $i: live=$LIVE expected=$EXPECTED"
            if [ "$LIVE" = "$EXPECTED" ]; then
              ASSETS=$(printf '%s' "$HTML" | grep -oE '/_next/static/[^"[:space:]<>]*\.(js|css)(\?[^"[:space:]<>]*)?' | sed 's/[?#].*//' | sort -u || true)
              if [ -z "$ASSETS" ]; then
                echo "❌ No JS/CSS assets found in live HTML"
                continue
              fi
              BAD=0
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                status=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL$path" || true)
                if [ "$status" != "200" ]; then
                  echo "❌ $status $path"
                  BAD=1
                fi
              done <<< "$ASSETS"
              if [ "$BAD" = "0" ]; then
                echo "✅ Live build matches and all referenced JS/CSS assets load"
                exit 0
              fi
            fi
          done
          echo "❌ Live site did not switch to build $EXPECTED with working assets"
          exit 1

      - name: ↩️ Roll back failed deployment
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "set -e; cd ${{ env.DEPLOY_BASE }}/current/nodejs; if [ ! -d .next.old ]; then echo '⚠️ No previous build backup is available; leaving the current build in place'; exit 0; fi; rm -rf .next.failed; mv .next .next.failed; if ! mv .next.old .next; then mv .next.failed .next; exit 1; fi; pkill -u \$(whoami) -f '[n]ext-server' || true; touch server.js; rm -rf .next.failed; echo '✅ Previous build restored'"

      - name: 🧹 Remove previous build after successful health check
        if: success()
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "rm -rf ${{ env.DEPLOY_BASE }}/current/nodejs/.next.old"
